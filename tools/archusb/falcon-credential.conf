# falcon-boot: do not let credential import kill the unlock unit.
#
# The loader hands the p3 passphrase to the UKI as an sd-stub companion
# credential. PID 1 files it under /run/credentials/@encrypted/, because the
# ESP is untrusted and credentials delivered that way are expected to be
# systemd-creds blobs. That directory survives switch-root, so every
# systemd-cryptsetup@.service the real root generates inherits
# ImportCredential=cryptsetup.* from systemd-cryptsetup-generator, tries to
# DECRYPT our plaintext passphrase, and dies at step CREDENTIALS with EINVAL
# (status 243) - before systemd-cryptsetup runs, so the keyfile named in
# /etc/crypttab is never even opened.
#
# Measured 2026-09-15 on the laptop: this is what left /efi unmounted with
# "Failed to start Cryptography Setup for cryptefi" on an otherwise clean boot.
#
# Clearing the import is the whole fix here. Unlike the initramfs drop-in
# (/etc/initcpio/install/falcon-credential), this one does NOT re-load the
# credential by path: everything in /etc/crypttab has a keyfile, and a
# LoadCredential= pointing at a file that is absent on a boot without the
# loader would fail the unit for a credential nothing here needs.
[Service]
ImportCredential=
